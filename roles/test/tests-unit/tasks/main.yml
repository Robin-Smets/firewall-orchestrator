- block:
    - name: ensure test roles dir exists
      file:
        path: "{{ test_dir }}/roles"
        state: directory
        owner: "{{ fworch_user }}"
        group: "{{ fworch_group }}"
        mode: "0755"
      become: true

    - name: ensure csharp test destination exists
      file:
        path: "{{ test_dir }}/roles/test/tests-unit/files"
        state: directory
        owner: "{{ fworch_user }}"
        group: "{{ fworch_group }}"
        mode: "0755"
      become: true

    - name: remove csharp dependency roots
      file:
        path: "{{ test_dir }}/roles/{{ item }}"
        state: absent
      loop:
        - lib
        - middleware
        - ui
      become: true

    - name: ensure csharp dependency roots exist
      file:
        path: "{{ test_dir }}/roles/{{ item }}"
        state: directory
        owner: "{{ fworch_user }}"
        group: "{{ fworch_group }}"
        mode: "0755"
      loop:
        - lib
        - middleware
        - ui
      become: true

    - name: sync csharp test project
      synchronize:
        src: "{{ role_path }}/files/FWO.Test"
        dest: "{{ test_dir }}/roles/test/tests-unit/files"
        rsync_opts:
          - "--chown={{ fworch_user }}:{{ fworch_group }}"
          - "--delete"
      become: true

    - name: sync csharp test dependencies
      synchronize:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        rsync_opts:
          - "--chown={{ fworch_user }}:{{ fworch_group }}"
          - "--delete"
      loop:
        - src: "{{ role_path }}/../../lib/files"
          dest: "{{ test_dir }}/roles/lib/files"
        - src: "{{ role_path }}/../../middleware/files"
          dest: "{{ test_dir }}/roles/middleware/files"
        - src: "{{ role_path }}/../../ui/files"
          dest: "{{ test_dir }}/roles/ui/files"
      become: true

    - name: run csharp tests
      command: dotnet test
      args:
        chdir: "{{ csharp_test_start_dir }}"
      become: true
      become_user: "{{ fworch_user }}"
      register: csharp_tests
      ignore_errors: false
      environment: "{{ proxy_env | default({}) | combine({'FW_SKIP_PDF_TEST': 'true'}) }}"

    - name: show csharp test results in case of errors
      debug:
        var: csharp_tests
      when: csharp_tests.rc != 0

  when: "'frontends' in group_names"
  # run only once (on frontends)

- block:
    - name: Run importer Python unit tests
      environment:
        PYTHONPATH: "/usr/local/fworch/importer"
      args:
        chdir: "/usr/local/fworch/importer/test"
      command: >
        {{ importer_venv_dir }}/bin/python3 -m unittest discover -s . -p "test_*.py" -v
